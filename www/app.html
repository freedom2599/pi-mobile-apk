<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#15171c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b9cf8'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='sans-serif'%3E%CF%80%3C/text%3E%3C/svg%3E">
<title>pi mobile</title>
<link rel="manifest" href="/manifest.webmanifest">
<style>
:root{
  --bg:#15171c; --bg2:#1b1e25; --bg3:#23272f; --line:#2c313b;
  --fg:#e6e8ec; --fg2:#9aa1ad; --fg3:#6b7280;
  --acc:#5b9cf8; --acc2:#7c5cf8; --ok:#3fb950; --err:#f85149; --warn:#d29922;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--fg);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* ---------- 顶栏 ---------- */
header{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:calc(var(--safe-t) + 8px) 12px 6px;
  background:var(--bg2);
  border-bottom:1px solid var(--line);
  position:relative;z-index:10;
}
#devBtn{
  display:flex;align-items:center;gap:6px;
  background:var(--bg3);border:1px solid var(--line);border-radius:10px;
  padding:6px 10px;font-size:13px;font-weight:600;max-width:40vw;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
#devBtn .dot{width:7px;height:7px;border-radius:50%;background:var(--fg3);flex:0 0 auto}
#devBtn.on .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
#devBtn.busy .dot{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.spacer{flex:1}
.iconbtn{
  width:36px;height:36px;border-radius:10px;background:var(--bg3);
  border:1px solid var(--line);display:grid;place-items:center;font-size:16px;
}
.iconbtn:active{background:#2b303a}
#status{
  flex:0 0 auto;font-size:11px;color:var(--fg2);
  padding:5px 14px 6px;min-height:22px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:var(--bg2);border-bottom:1px solid var(--line);
}
#status b{color:var(--acc);font-weight:600}

/* ---------- 消息区 ---------- */
#log{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
  padding:10px 12px 4px;
  display:flex;flex-direction:column;gap:10px;
  -webkit-overflow-scrolling:touch;
}
.msg{display:flex;flex-direction:column;gap:4px;max-width:100%}
.msg .who{font-size:11px;color:var(--fg3);padding:0 2px}
.msg .bubble{
  border-radius:14px;padding:9px 13px;white-space:pre-wrap;word-break:break-word;
  overflow-wrap:anywhere;
}
.msg.user{align-items:flex-end}
.msg.user .bubble{background:linear-gradient(135deg,var(--acc),#4171d6);color:#fff;border-bottom-right-radius:5px;max-width:88%}
.msg.ai .bubble{background:var(--bg2);border:1px solid var(--line);border-bottom-left-radius:5px;max-width:96%}
.msg.sys .bubble{background:transparent;border:1px dashed var(--line);color:var(--fg2);font-size:12.5px;max-width:100%}
.msg.err .bubble{background:#3a1b1b;border:1px solid #6e2b2b;color:#ffb3ad}

/* 工具结果图片 */
.tool-imgs{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px 2px}
.tool-img{
  max-width:120px;max-height:120px;border-radius:8px;border:1px solid var(--line);
  background:#0e1014;object-fit:cover;cursor:pointer;display:block;
}
.tool-img:active{opacity:.8}
.tool-img-err{
  font-size:11px;color:#ffb3ad;padding:8px 10px;background:#2a1a1a;
  border-radius:8px;border:1px solid #4a2626;
}
.lightbox{
  position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:9999;
  display:none;align-items:center;justify-content:center;padding:12px;
}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lb-load{
  position:absolute;top:50%;left:0;right:0;text-align:center;
  color:#8b93a1;font-size:13px;transform:translateY(-50%);
}
.lb-hint{
  position:absolute;bottom:24px;left:0;right:0;text-align:center;
  color:#8b93a1;font-size:12px;
}

/* Markdown 渲染 */
.block.text.md{white-space:normal}
.md{white-space:normal}
.md p{margin:0 0 8px}
.md p:last-child{margin-bottom:0}
.md h3,.md h4,.md h5,.md h6{margin:12px 0 6px;font-weight:600;line-height:1.35}
.md h3{font-size:16px}.md h4{font-size:15px}.md h5,.md h6{font-size:14px}
.md h3:first-child,.md h4:first-child,.md p:first-child{margin-top:0}
.md ul,.md ol{margin:0 0 8px;padding-left:20px}
.md li{margin:2px 0}
.md li > ul,.md li > ol{margin:2px 0}
.md code{
  background:#0e1014;border:1px solid var(--line);border-radius:4px;
  padding:1px 5px;font-family:ui-monospace,Menlo,monospace;font-size:.88em;color:#9ecbff;
}
.md pre{
  margin:0;padding:10px 12px;background:#0e1014;border-radius:0 0 9px 9px;
  overflow-x:auto;font-family:ui-monospace,Menlo,monospace;
  font-size:11.5px;line-height:1.6;color:#c9d1d9;
}
.md pre code{background:none;border:0;padding:0;color:inherit;font-size:inherit}
.md-code{position:relative;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:8px 0;background:#0e1014}
.md-lang{
  padding:5px 11px;font-size:10.5px;color:var(--fg3);background:#141820;
  border-bottom:1px solid var(--line);font-family:ui-monospace,Menlo,monospace;
  text-transform:lowercase;letter-spacing:.03em;
}
.md-copy{
  position:absolute;top:5px;right:6px;font-size:10.5px;padding:3px 8px;
  border-radius:6px;background:#23272f;border:1px solid var(--line);
  color:var(--fg2);opacity:.9;
}
.md-copy:active{background:#2f3542}
.md blockquote{
  margin:8px 0;padding:6px 12px;border-left:3px solid var(--acc);
  background:#1a1d24;color:var(--fg2);border-radius:0 8px 8px 0;
}
.md blockquote p{margin:0}
.md hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.md a{color:var(--acc);text-decoration:none;border-bottom:1px solid rgba(91,156,248,.35)}
.md del{opacity:.6}
.md strong{font-weight:600;color:#fff}
.md-table-wrap{overflow-x:auto;margin:8px 0;border:1px solid var(--line);border-radius:9px}
.md table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:100%}
.md th,.md td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.md th{background:#1a1d24;font-weight:600;color:var(--fg2);font-size:11.5px}
.md tr:last-child td{border-bottom:0}

/* 思考/工具块 */
.block{border-radius:10px;margin:4px 0;font-size:13px;overflow:hidden}
.think{background:#1a1c22;border-left:2px solid var(--acc2);color:var(--fg2);padding:7px 10px;font-style:italic}
.think summary{cursor:pointer;font-style:normal;font-size:12px;color:var(--acc2);font-style:normal;list-style:none}
.think summary::-webkit-details-marker{display:none}
.tool{background:#161a20;border:1px solid #2a2f38;padding:0}
.tool .thead{
  display:flex;align-items:center;gap:7px;padding:7px 10px;
  font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.tool .tname{color:var(--acc);font-weight:600}
.tool .targs{color:var(--fg3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool .tstat{font-size:11px;color:var(--fg3)}
.tool.running .tstat{color:var(--warn)}
.tool.ok .tstat{color:var(--ok)}
.tool.error .tstat{color:var(--err)}
.tool pre{
  margin:0;padding:0 10px 8px;font-size:11.5px;color:var(--fg2);
  white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto;
}
.spin{width:10px;height:10px;border:2px solid var(--warn);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* 光标 */
.cursor::after{content:'▍';color:var(--acc);animation:bl .9s steps(2) infinite;margin-left:1px}
@keyframes bl{50%{opacity:0}}

/* ---------- 输入区 ---------- */
footer{
  flex:0 0 auto;padding:8px 10px calc(var(--safe-b) + 8px);
  background:var(--bg2);border-top:1px solid var(--line);
}
#quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
#quick::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:5px 11px;border-radius:999px;font-size:12.5px;
  background:var(--bg3);border:1px solid var(--line);color:var(--fg2);white-space:nowrap;
}
.chip:active{background:#2f3542;color:var(--fg)}
.chip.danger{color:#ffb3ad;border-color:#5a2a2a}
.inrow{display:flex;gap:8px;align-items:flex-end}
#attachBar{display:none;flex-wrap:wrap;gap:6px;padding:0 0 8px}
#attachBar.on{display:flex}
.attachChip{display:inline-flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--acc);border-radius:999px;padding:4px 9px;font-size:11.5px;max-width:100%}
.attachChip button{color:var(--fg3);font-size:14px;line-height:1;padding:0 2px}
#inp{
  flex:1;min-height:42px;max-height:130px;resize:none;
  background:var(--bg3);color:var(--fg);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;font:inherit;line-height:1.4;
  outline:none;
}
#inp:focus{border-color:var(--acc)}
#stopSend{
  display:none;width:42px;height:42px;border-radius:12px;flex:none;
  background:var(--bg3);border:1px solid #5a2a2a;color:#ffb3ad;
  font-size:15px;margin-right:6px;
}
#stopSend.on{display:block}
#stopSend:active{background:#3a2020}
#send{
  width:44px;height:42px;flex:0 0 auto;border-radius:12px;
  background:linear-gradient(135deg,var(--acc),#4171d6);color:#fff;
  display:grid;place-items:center;font-size:17px;font-weight:700;
}
#send:disabled{opacity:.35}
#send.stop{background:linear-gradient(135deg,#f85149,#b62d26)}

/* ---------- 抽屉 ---------- */
#sheet{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;
  display:none;align-items:flex-end;
}
#sheet.open{display:flex}
#sheetIn{
  width:100%;max-height:80vh;overflow:auto;background:var(--bg2);
  border-radius:18px 18px 0 0;padding:14px 14px calc(var(--safe-b) + 18px);
  border-top:1px solid var(--line);
  animation:up .2s ease-out;
}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
#sheetIn h3{margin:0 0 10px;font-size:13px;color:var(--fg3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.row{
  display:flex;align-items:center;gap:10px;padding:13px 14px;
  border-radius:11px;background:var(--bg3);margin-bottom:8px;font-size:14px;
  width:100%;text-align:left;
}
.row:active{background:#2f3542}
.row .grow{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:11.5px;color:var(--fg3);display:block}
.row.sel{border:1px solid var(--acc)}
.row .tick{color:var(--acc);font-weight:700}
.row .chev{color:var(--fg3);font-size:17px;line-height:1;opacity:.7}

/* 对话列表分组标题（可折叠） */
.sess-group{
  display:flex;align-items:center;gap:6px;
  font-size:11.5px;color:var(--fg3);font-weight:600;letter-spacing:.04em;
  margin:14px 0 7px;padding:6px 8px;border-radius:8px;
  cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
}
.sess-group:first-child{margin-top:0}
.sess-group:active{background:var(--bg3)}
.sess-group .sg-arrow{
  font-size:10px;width:12px;text-align:center;opacity:.8;
  transition:transform .15s;
}
.sess-group .sg-name{flex:1}
.sess-group .sg-count{
  font-size:10.5px;font-weight:400;color:var(--fg3);
  background:var(--bg3);border-radius:9px;padding:1px 7px;letter-spacing:0;
}
.sess-group.collapsed{opacity:.75}
#sessBox mark{
  background:rgba(91,156,248,.28);color:var(--acc);
  border-radius:3px;padding:0 1px;
}
#sessSearch::-webkit-search-cancel-button{display:none}

/* toast */
#toast{
  position:fixed;left:50%;bottom:calc(var(--safe-b) + 90px);transform:translateX(-50%) translateY(10px);
  background:#31363f;color:var(--fg);padding:9px 16px;border-radius:10px;font-size:13px;
  opacity:0;pointer-events:none;transition:.2s;z-index:200;max-width:80vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* UI 对话框 */
#dialog{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150;display:none;align-items:center;justify-content:center;padding:20px}
#dialog.open{display:flex}
#dialog.force{background:rgba(0,0,0,.82)}
#dialog.force #dialogIn{animation:forcePulse .5s ease}
#dialogIn{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;max-width:420px}
#dialogIn .q{font-size:14px;margin-bottom:12px;white-space:pre-wrap}
#dialogIn .opt{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:10px;background:var(--bg3);margin-bottom:7px;font-size:13.5px}
#dialogIn .opt:active{background:#2f3542}
#dialogIn .opt .num{color:var(--acc);font-weight:700;margin-right:8px}

/* 全屏页面（设置等），从右侧滑入 */
#page{
  position:fixed;inset:0;background:var(--bg);z-index:60;
  transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;visibility:hidden;
}
#page.open{transform:translateX(0);visibility:visible}
#pageIn{
  flex:1;overflow-y:auto;overscroll-behavior:contain;
  padding:0 14px calc(24px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch;
}
.page-head{
  position:sticky;top:0;z-index:2;background:var(--bg);
  display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;margin:0 -14px 6px;
  border-bottom:1px solid var(--line);
}
.page-head .ph-back{
  width:34px;height:34px;border-radius:9px;background:var(--bg3);
  border:1px solid var(--line);color:var(--fg);font-size:16px;flex:none;
}
.page-head .ph-back:active{background:#2f3542}
.page-head .ph-title{font-size:16px;font-weight:600;flex:1}
.sec-title{
  font-size:11.5px;color:var(--fg3);font-weight:600;letter-spacing:.04em;
  margin:18px 2px 8px;
}
.sec-title:first-child{margin-top:4px}
.set-row{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:13px 14px;border-radius:11px;background:var(--bg3);
  margin-bottom:7px;font-size:14px;color:var(--fg);border:0;
}
.set-row:active{background:#2f3542}
.set-row .sr-main{flex:1;min-width:0}
.set-row .sr-label{display:block}
.set-row .sr-sub{display:block;font-size:11.5px;color:var(--fg3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-row .sr-ico{width:20px;text-align:center;font-size:15px;flex:none;opacity:.85}
.set-row .sr-chev{color:var(--fg3);font-size:17px;flex:none;opacity:.6}
.set-row.danger{color:#ffb3ad}
.set-row.danger .sr-label{color:#ffb3ad}
.set-note{
  font-size:11.5px;color:var(--fg3);line-height:1.7;
  padding:10px 12px;background:rgba(255,255,255,.02);
  border:1px dashed var(--line);border-radius:10px;margin-top:10px;
}
.set-note code{background:#0e1014;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11px;color:#9ecbff}
</style>
</head>
<body>

<header>
  <button id="devBtn"><span class="dot"></span><span id="devName">连接中…</span><span style="color:var(--fg3);font-size:10px">▾</span></button>
  <button id="sessBtn" class="iconbtn" title="对话列表" style="width:auto;padding:0 9px;font-size:12.5px;gap:5px;display:flex">☰ 对话</button>
  <button id="fileBtn" class="iconbtn" title="浏览文件" style="width:auto;padding:0 9px;font-size:12.5px;gap:5px;display:flex">🗀 文件</button>
  <div class="spacer"></div>
  <button class="iconbtn" id="menuBtn">⚙</button>
</header>
<div id="status"></div>

<div id="log"></div>

<footer>
  <div id="quick">
    <button class="chip" data-cmd="/status">状态</button>
    <button class="chip" data-cmd="/new">新会话</button>
    <button class="chip" data-cmd="/compact">压缩</button>
    <button class="chip" data-cmd="/model">模型</button>
    <button class="chip" data-cmd="/help">帮助</button>
  </div>
  <div id="attachBar"></div>
  <div class="inrow">
    <textarea id="inp" rows="1" placeholder="说点什么…" autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
    <button id="stopSend" class="hidden-btn" title="停止">■</button>
    <button id="send">↑</button>
  </div>
</footer>

<div id="page"><div id="pageIn"></div></div>
<div id="sheet"><div id="sheetIn"></div></div>
<div id="dialog"><div id="dialogIn"></div></div><div id="toast"></div>

<script>
'use strict';

const $ = s => document.querySelector(s);
const logEl = $('#log'), inp = $('#inp'), sendBtn = $('#send');

const S = {
  ws: null,
  device: localStorage.getItem('pi.device') || 'local',
  devices: [],
  streaming: false,
  busy: false,
  cur: null,          // 当前 AI 气泡 DOM
  curBody: null,      // 其中正文容器
  blocks: [],         // 当前流式块
  retry: 0,
  token: new URLSearchParams(location.search).get('token') || localStorage.getItem('pi.token') || '',
  models: [],
  lastPong: Date.now(),
  attachments: [],
  apiBase: '',        // 空 = 同源（浏览器模式）；有值 = APK 模式指向远程服务器
  appVersion: 0,      // APK 内注入的 versionCode
  remoteVersion: null,
  forceUpdate: false, // 强制更新中（禁用其它操作）
};

// 落后多少个版本后强制更新
const FORCE_UPDATE_GAP = 2;

// ---------------------------------------------------------------- 网络层
// 浏览器模式：同源 + cookie。APK 模式：远程 base + Bearer token。

/** API 绝对地址 */
function apiUrl(path) {
  return (S.apiBase || '') + path;
}

/**
 * 给 <img>/<a> 用的地址：无法自定义请求头，把 token 塞进 query。
 * 浏览器同源模式靠 cookie，不用加。
 */
function imgUrl(path) {
  const base = apiUrl(path);
  if (!S.apiBase) return base;
  const tok = localStorage.getItem('pi.token') || '';
  if (!tok) return base;
  return base + (base.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(tok);
}

/** 统一的 fetch：自动带 token、CORS */
function apiFetch(path, opts = {}) {
  const o = { ...opts, credentials: S.apiBase ? 'omit' : 'same-origin' };
  o.headers = { ...(opts.headers || {}) };
  const tok = localStorage.getItem('pi.token');
  if (tok) o.headers['authorization'] = 'Bearer ' + tok;
  return fetch(apiUrl(path), o);
}

/** 401 时统一跳登录 */
function handle401(r) {
  if (r.status === 401) {
    if (S.apiBase) {
      // APK 模式：清 token，回引导页/登录页
      localStorage.removeItem('pi.token');
      modalLogin();
    } else {
      location.href = '/login?next=' + encodeURIComponent(location.pathname);
    }
    return true;
  }
  return false;
}

// ---------------------------------------------------------------- Markdown
// 轻量渲染：代码块/行内代码/粗体/斜体/标题/列表/引用/链接/表格/分隔线
// 不引入外部库，保证离线可用。所有文本都经过转义，只生成受控标签。

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/** 行内标记（已转义输入） */
function renderInline(escaped) {
  let t = escaped;
  // 行内代码 `x`
  const codes = [];
  t = t.replace(/`([^`]+)`/g, (_, c) => {
    codes.push(c);
    return '\u0000C' + (codes.length - 1) + '\u0000';
  });
  // 粗体 **x** / __x__
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  // 斜体 *x* / _x_：内部非空且不含星号；避免 2*3*4 这类算式（要求内部含非数字或两侧不像运算符）
  t = t.replace(/\*([^*\s](?:[^*]*[^*\s])?)\*/g, (m, c) => {
    // 纯数字/算式不当斜体
    if (/^[\d\s+\-*/.=%]+$/.test(c)) return m;
    return '<em>' + c + '</em>';
  });
  t = t.replace(/(^|[^\w])_([^_\s](?:[^_]*[^_\s])?)_(?![\w])/g, '$1<em>$2</em>');
  // 删除线 ~~x~~
  t = t.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  // 链接 [text](url) —— 仅 http/https
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  // 裸链接
  t = t.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,
    '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  // 还原行内代码
  t = t.replace(/\u0000C(\d+)\u0000/g, (_, i) => '<code>' + codes[+i] + '</code>');
  return t;
}

/**
 * 把 markdown 转成 HTML。
 * 返回 { html, isMarkdown } —— 不像 markdown 的纯文本就别折腾，保持原样更省心。
 */
function mdToHtml(src) {
  const text = String(src || '');
  // 判定是否值得当 markdown 渲染
  const looksMd = /(^|\n)\s*(```|#{1,6}\s|[-*+]\s|\d+\.\s|>\s|\|.*\|)|\*\*[^*]+\*\*|`[^`]+`|\[[^\]]+\]\(https?:/m.test(text);
  if (!looksMd) return { html: null, isMarkdown: false };

  const lines = text.replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let i = 0;

  const inline = (s) => renderInline(escapeHtml(s));

  while (i < lines.length) {
    const line = lines[i];

    // 代码块
    const fence = line.match(/^\s*(```+|~~~+)\s*([\w+-]*)\s*$/);
    if (fence) {
      const marker = fence[1][0];
      const lang = fence[2] || '';
      const buf = [];
      i++;
      while (i < lines.length && !new RegExp('^\\s*' + marker + '{3,}\\s*$').test(lines[i])) {
        buf.push(lines[i]);
        i++;
      }
      i++; // 跳过结束围栏
      const code = escapeHtml(buf.join('\n'));
      out.push(
        '<div class="md-code">' +
        (lang ? '<div class="md-lang">' + escapeHtml(lang) + '</div>' : '') +
        '<pre><code>' + code + '</code></pre>' +
        '</div>'
      );
      continue;
    }

    // 空行
    if (!line.trim()) { i++; continue; }

    // 分隔线
    if (/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(line)) {
      out.push('<hr>');
      i++;
      continue;
    }

    // 标题
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      const lv = Math.min(h[1].length + 2, 6); // h1→h3，避免过大
      out.push('<h' + lv + '>' + inline(h[2].trim()) + '</h' + lv + '>');
      i++;
      continue;
    }

    // 引用
    if (/^\s*>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*>\s?/, ''));
        i++;
      }
      const inner = mdToHtml(buf.join('\n'));
      const innerHtml = inner.isMarkdown ? (inner.html || '') : '<p>' + buf.map(inline).join('<br>') + '</p>';
      out.push('<blockquote>' + innerHtml.replace(/^<p>/, '').replace(/<\/p>$/, '') + '</blockquote>');
      continue;
    }

    // 表格
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const parseRow = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const head = parseRow(line);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
        rows.push(parseRow(lines[i]));
        i++;
      }
      let t = '<div class="md-table-wrap"><table><thead><tr>';
      for (const c of head) t += '<th>' + inline(c) + '</th>';
      t += '</tr></thead><tbody>';
      for (const r of rows) {
        t += '<tr>';
        for (let k = 0; k < head.length; k++) t += '<td>' + inline(r[k] || '') + '</td>';
        t += '</tr>';
      }
      t += '</tbody></table></div>';
      out.push(t);
      continue;
    }

    // 有序 / 无序列表（支持多层嵌套）
    if (/^\s*([-*+]|\d+\.)\s+/.test(line)) {
      const items = [];   // {indent, ordered, text}
      let k = i;
      while (k < lines.length) {
        const cur = lines[k];
        const m = cur.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
        if (m) {
          items.push({ indent: m[1].length, ordered: /\d+\./.test(m[2]), text: m[3] });
          k++;
          continue;
        }
        if (cur.trim() && items.length && cur.match(/^\s*/)[0].length > items[items.length - 1].indent) {
          items[items.length - 1].text += '<br>' + inline(cur.trim());
          k++;
          continue;
        }
        break;
      }
      i = k;

      // 递归：把 indent >= base 的项收集成一组
      const renderList = (startIdx, base) => {
        let idx = startIdx;
        const tag = items[idx].ordered ? 'ol' : 'ul';
        let html = '<' + tag + '>';
        while (idx < items.length && items[idx].indent >= base) {
          const it = items[idx];
          if (it.indent > base) {
            // 子列表挂到上一个 li 里
            const sub = renderList(idx, it.indent);
            html = html.replace(/<\/li>$/, '') + sub.html + '</li>';
            idx = sub.next;
            continue;
          }
          // 同级项
          const text = it.text.includes('<br>') ? it.text : inline(it.text);
          // 看下一个是不是更深 → 先开 li，让子列表挂进来
          if (idx + 1 < items.length && items[idx + 1].indent > base) {
            html += '<li>' + text;
            idx++;
            const sub = renderList(idx, items[idx].indent);
            html += sub.html + '</li>';
            idx = sub.next;
            continue;
          }
          html += '<li>' + text + '</li>';
          idx++;
        }
        html += '</' + tag + '>';
        return { html, next: idx };
      };

      const res = renderList(0, items[0].indent);
      out.push(res.html);
      continue;
    }

    // 普通段落（合并连续非空行）
    const para = [];
    while (i < lines.length && lines[i].trim() &&
           !/^\s*(```|~~~|#{1,6}\s|>\s|[-*+]\s|\d+\.\s|\|.*\|)/.test(lines[i]) &&
           !/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(lines[i])) {
      para.push(lines[i]);
      i++;
    }
    if (para.length) {
      out.push('<p>' + para.map(inline).join('<br>') + '</p>');
    } else {
      i++;
    }
  }

  return { html: out.join(''), isMarkdown: true };
}

/** 渲染气泡内容：markdown 优先，失败退回纯文本 */
function setBubbleHTML(el, text, isAi) {
  if (isAi) {
    const r = mdToHtml(text);
    if (r.isMarkdown) {
      el.innerHTML = r.html;
      el.classList.add('md');
      // 代码块加复制按钮
      el.querySelectorAll('.md-code pre').forEach(pre => {
        if (pre.dataset.enh) return;
        pre.dataset.enh = '1';
        const btn = document.createElement('button');
        btn.className = 'md-copy';
        btn.textContent = '复制';
        btn.onclick = async (e) => {
          e.stopPropagation();
          const ok = await copyText(pre.querySelector('code')?.textContent || '');
          btn.textContent = ok ? '已复制' : '失败';
          setTimeout(() => { btn.textContent = '复制'; }, 1500);
        };
        pre.parentNode.appendChild(btn);
      });
      return;
    }
  }
  el.textContent = text;
}

// ---------------------------------------------------------------- 工具
function toast(t) {
  const el = $('#toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2200);
}
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
function nearBottom() { return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 120; }
function scrollDown(force) { if (force || nearBottom()) requestAnimationFrame(() => logEl.scrollTop = logEl.scrollHeight); }

// ---------------------------------------------------------------- 渲染
function addMsg(role, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  if (role !== 'sys') {
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = role === 'user' ? '你' : role === 'ai' ? 'pi' : '';
    if (who.textContent) wrap.appendChild(who);
  }
  const b = document.createElement('div');
  b.className = 'bubble';
  setBubbleHTML(b, text, role === 'ai');
  wrap.appendChild(b);
  logEl.appendChild(wrap);
  scrollDown();
  return wrap;
}

function newAiBubble() {
  const wrap = document.createElement('div');
  wrap.className = 'msg ai';
  const who = document.createElement('div');
  who.className = 'who'; who.textContent = 'pi';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  wrap.append(who, bubble);
  logEl.appendChild(wrap);
  scrollDown(true);
  return { wrap, bubble };
}

// 流式块渲染：think / tool / text
function ensureCur() {
  if (!S.cur) {
    const { wrap, bubble } = newAiBubble();
    S.cur = wrap;
    S.curBody = bubble;
    S.blocks = [];
  }
}

// 流式临时块标记，turn 结束时可被安全移除
function tmpBlock(el) { el._tmp = true; return el; }

function blockEl(type, meta = {}) {
  if (type === 'thinking') {
    const d = document.createElement('details');
    d.className = 'block think';
    d.open = true;
    const s = document.createElement('summary');
    s.textContent = '思考中…';
    const p = document.createElement('div');
    p.className = 'p';
    d.append(s, p);
    d._body = p; d._sum = s;
    return d;
  }
  if (type === 'tool') {
    const d = document.createElement('div');
    d.className = 'block tool running';
    d.innerHTML = '<div class="thead"><span class="spin"></span>' +
      '<span class="tname">' + esc(meta.name || 'tool') + '</span>' +
      '<span class="targs"></span><span class="tstat">运行中</span></div><pre></pre>';
    d._pre = d.querySelector('pre');
    d._stat = d.querySelector('.tstat');
    d._spin = d.querySelector('.spin');
    d._args = d.querySelector('.targs');
    return d;
  }
  const div = document.createElement('div');
  div.className = 'block text';
  div.style.whiteSpace = 'pre-wrap';
  return div;
}

function renderStreamBlocks(blocks) {
  S.curBody.innerHTML = '';
  S.blocks = [];
  for (const b of blocks) {
    const el = blockEl(b.type, b);
    if (b.type === 'thinking') el._body.textContent = b.text;
    else if (b.type === 'tool') { el._pre.textContent = b.text || ''; }
    else el.textContent = b.text;
    S.curBody.appendChild(el);
    S.blocks.push({ type: b.type, el, id: b.id });
  }
}

function appendDelta(type, text, index) {
  ensureCur();
  // 若最后一个块类型不同则新开
  let b = S.blocks[S.blocks.length - 1];
  if (!b || b.type !== type) {
    const el = tmpBlock(blockEl(type));
    S.curBody.appendChild(el);
    b = { type, el, tmp: true };
    S.blocks.push(b);
  }
  if (type === 'thinking') b.el._body.textContent += text;
  else b.el.textContent += text;
  b.el.classList.add('cursor');
  for (const o of S.blocks) if (o !== b) o.el.classList.remove('cursor');
  scrollDown();
}

// ---------------------------------------------------------------- 消息分发
function handle(m) {
  switch (m.t) {
    case 'hello':
      updateDevLabel(m.device, m.state);
      S.currentPath = m.sessionPath || null;
      if (m.history?.length) rebuildHistory(m.history);
      applyState(m.state);
      setStatus('');
      // 首次连上后检查一次更新，之后每 30 分钟复查（强制更新需反复提醒）
      if (!S.versionChecked) {
        S.versionChecked = true;
        setTimeout(() => checkUpdate(false), 2500);
      }
      if (!S.versionTimer) {
        S.versionTimer = setInterval(() => {
          // 强制更新且弹窗已被绕过时，再弹一次
          if (S.forceUpdate && !document.getElementById('dialog')?.classList.contains('open')) {
            checkUpdate(false);
          } else if (document.visibilityState === 'visible') {
            checkUpdate(false);
          }
        }, 30 * 60 * 1000);
      }
      break;
    case 'devices':
      S.devices = m.devices;
      // 当前设备被删或改名时同步顶栏
      {
        const me = (m.devices || []).find(x => x.id === S.device);
        if (me) $('#devName').textContent = me.label || me.id;
        else if (m.devices && m.devices.length) {
          S.device = m.devices[0].id;
          localStorage.setItem('pi.device', S.device);
          $('#devName').textContent = m.devices[0].label || m.devices[0].id;
          S.ws?.send(JSON.stringify({ t: 'attach', deviceId: S.device }));
        }
      }
      break;

    case 'device_test_start':
      {
        const box = document.getElementById('devFormResult');
        if (box) { box.style.display = 'block'; box.textContent = '正在测试 ' + (m.label || m.deviceId) + '…'; }
      }
      break;

    case 'device_test_result':
      renderDeviceTest(m);
      break;

    case 'device_saved': {
      const p = m.probed || {};
      const box = document.getElementById('devFormResult');
      const html = '✅ 已保存 **' + esc(m.device.label || m.device.id) + '**\n\n' +
        '自动探测：\n' +
        (p.cwd ? '· 工作目录 ' + esc(p.cwd) + '\n' : '') +
        (p.sessionDir ? '· 会话目录 ' + esc(p.sessionDir) + '\n' : '') +
        (p.pathPrefix ? '· node 目录 ' + esc(p.pathPrefix) + '\n' : '· node 目录 （用系统默认）\n') +
        (p.sessionReadable ? '· 会话目录可读' : '· ⚠️ 会话目录不可读（历史列表为空）');
      if (box) {
        box.style.display = 'block';
        box.style.borderColor = '#2c5a35';
        box.style.background = '#16211a';
        box.textContent = html;
        setTimeout(() => openSheet('devices'), 1200);
      } else {
        toast('已保存 ' + (m.device.label || m.device.id));
      }
      break;
    }

    case 'attached':
      S.device = m.deviceId;
      localStorage.setItem('pi.device', m.deviceId);
      break;

    case 'state':
      S.lastState = m.state;
      applyState(m.state);
      // 状态弹窗打开时实时刷新
      if (typeof S.statusDlgRender === 'function' &&
          document.getElementById('dialog')?.classList.contains('open')) {
        S.statusDlgRender(m.state);
      }
      break;

    case 'user_message':
      // 服务端会把发出的用户消息也回过来；本地已经回显，跳过
      break;

    case 'assistant_message':
      finalizeAssistant(m.message);
      break;

    case 'agent_start':
      S.streaming = true;
      applyBusy();
      break;

    case 'block_start':
      if (m.type === 'tool') {
        ensureCur();
        const el = tmpBlock(blockEl('tool', { name: m.name }));
        S.curBody.appendChild(el);
        S.blocks.push({ type: 'tool', el, id: m.id, name: m.name, tmp: true });
      } else {
        appendDelta(m.type, '', m.index);
      }
      break;

    case 'delta':
      appendDelta(m.type, m.text, m.index);
      break;

    case 'tool_start':
      markTool(m.id, 'running', m.name, m.args);
      break;

    case 'tool_end':
      markTool(m.id, m.isError ? 'error' : 'ok', m.name, null, m.text, m.durationMs, m.images);
      break;

    case 'tool_state':
      markTool(m.id, m.state, null, null, null, m.durationMs);
      break;

    case 'block_tool_end':
      // 工具参数在 toolcall_end 时才有完整值，这里补上
      if (m.toolCall) {
        const b = S.blocks.find(x => x.type === 'tool' && x.id === m.toolCall.id);
        if (b && m.toolCall.arguments) {
          const a = m.toolCall.arguments;
          b.el._args.textContent = (a.command || a.path || a.pattern || JSON.stringify(a)).slice(0, 100);
        }
      }
      break;

    case 'settled':
      S.streaming = false;
      applyBusy();
      finishCursor();
      if (m.aborted) toast('已中断');
      break;
    case 'stream_resume':
      ensureCur();
      renderStreamBlocks(m.blocks);
      S.streaming = true; applyBusy();
      break;

    case 'notice':
      addMsg('sys', m.text);
      break;

    case 'system_message':
      addMsg('sys', (m.message.content?.[0]?.text) || '');
      break;

    case 'stderr':
      addMsg('err', m.text);
      break;

    case 'proc_exit':
      S.streaming = false; applyBusy();
      addMsg('err', '⚠️ pi 进程退出 code=' + m.code);
      break;

    case 'proc_error':
      addMsg('err', '⚠️ ' + m.message);
      break;

    case 'cleared':
      clearLog(); toast('已开新会话');
      break;

    case 'messages':
      // 只有在界面为空时才重绘，避免和本地回显重复
      if (!logEl.children.length) rebuildHistory(m.messages);
      break;

    case 'sessions':
      renderSessions(m.sessions || [], m.currentPath || null);
      break;

    case 'session_opened':
      S.currentPath = m.path;
      if (m.messages?.length) rebuildHistory(m.messages);
      if (m.state) applyState(m.state);
      toast(m.mode === 'restarted' ? '已重启并加载会话' : '已切换会话');
      break;

    case 'hello_lite':
      if (m.history?.length) rebuildHistory(m.history);
      if (m.state) applyState(m.state);
      break;

    case 'models':
      S.models = m.models;
      showModels();
      break;

    case 'ui_request':
      showUiRequest(m.rec);
      break;

    case 'error':
      toast('❌ ' + m.message);
      break;

    case 'fatal':
      addMsg('err', m.message);
      break;

    case 'pong':
      S.lastPong = Date.now();
      break;
  }
}

// ---------------------------------------------------------------- 消息渲染细节
function clearLog() { logEl.innerHTML = ''; S.cur = null; S.curBody = null; S.blocks = []; pendingEcho = []; }

// 本地回显的用户消息去重：发出去后短时间内收到相同 user 历史/事件则跳过
let pendingEcho = [];

function isEcho(text) {
  const i = pendingEcho.indexOf(text);
  if (i >= 0) { pendingEcho.splice(i, 1); return true; }
  return false;
}

function rebuildHistory(history) {
  clearLog();
  // 长会话只渲染尾部，避免手机上 DOM 过多卡顿
  const MAX = 150;
  const total = history.length;
  const shown = total > MAX ? history.slice(-MAX) : history;
  if (total > MAX) {
    const tip = document.createElement('div');
    tip.className = 'msg sys';
    tip.innerHTML = `<div class="bubble">前面还有 ${total - MAX} 条历史未显示</div>`;
    logEl.appendChild(tip);
  }
  for (const m of shown) {
    const parts = (m.content || []);
    if (m.role === 'user') {
      const t = parts.filter(c => c.type === 'text').map(c => c.text).join('');
      if (t) addMsg('user', t);
    } else if (m.role === 'assistant') {
      // 有工具调用就建一个带工具块的 AI 气泡
      const tools = parts.filter(c => c.type === 'tool');
      const t = parts.filter(c => c.type === 'text').map(c => c.text).join('');
      if (!tools.length && !t) continue;
      const { wrap, bubble } = newAiBubble();
      for (const tl of tools) {
        const el = blockEl('tool', { name: tl.name });
        el.classList.remove('running'); el.classList.add('ok');
        if (el._spin) el._spin.remove();
        el._stat.textContent = '✓';
        const a = tl.args || tl.arguments || {};
        el._args.textContent = (a.command || a.path || a.pattern || (Object.keys(a).length ? JSON.stringify(a) : '')).slice(0, 100);
        bubble.appendChild(el);
      }
      if (t) {
        const d = document.createElement('div');
        d.className = 'block text';
        setBubbleHTML(d, t, true);
        bubble.appendChild(d);
      }
    } else if (m.role === 'system') {
      const t = parts.filter(c => c.type === 'text').map(c => c.text).join('');
      if (t && t !== '（历史已压缩）') addMsg('sys', t);
    }
  }
  S.cur = null; S.curBody = null; S.blocks = [];
  scrollDown(true);
}

// 一次 agent run 内有多个 turn，每个 assistant message_end 单独到达。
// 策略：都往同一个气泡里追加：每个 turn 落的块按顺序 retain住，
// 只清除「本 turn 正在流式的那块」，避免不断重写整个气泡。
let curTurnBlocks = [];   // 本 turn 内已定型的块 DOM

function finalizeAssistant(msg) {
  ensureCur();
  const text = (msg.content || []).filter(c => c.type === 'text').map(c => c.text).join('');
  const thinks = (msg.content || []).filter(c => c.type === 'thinking').map(c => c.text);
  const tools = (msg.content || []).filter(c => c.type === 'tool');

  // 清掉本 turn 内被流式累积的临时块（S.blocks），但保留之前 turn 已定型的块
  for (const b of S.blocks) {
    if (b.tmp && b.el.parentNode) b.el.parentNode.removeChild(b.el);
  }
  S.blocks = [];

  for (const tk of thinks) {
    if (!tk) continue;
    const d = blockEl('thinking');
    d._body.textContent = tk;
    d._sum.textContent = '思考过程';
    d.open = false;
    S.curBody.appendChild(d);
  }
  for (const t of tools) {
    const el = blockEl('tool', { name: t.name });
    el.classList.remove('running'); el.classList.add('ok');
    if (el._spin) el._spin.remove();
    el._stat.textContent = '✓';
    el._args.textContent = t.args ? (t.args.command || t.args.path || t.args.pattern || JSON.stringify(t.args)).slice(0, 100) : '';
    S.curBody.appendChild(el);
  }
  if (text) {
    const d = document.createElement('div');
    d.className = 'block text';
    setBubbleHTML(d, text, true);
    S.curBody.appendChild(d);
  }
  scrollDown();
  // 注意：不在这里收尾气泡，等 settled 统一收
}

function finishCursor() {
  for (const b of S.blocks) b.el.classList.remove('cursor');
  // 流式结束后把空气泡删掉
  if (S.cur && !S.curBody.textContent.trim() && !S.curBody.children.length) S.cur.remove();
  S.cur = null; S.curBody = null; S.blocks = [];
}
function markTool(id, state, name, args, out, durationMs, images) {
  ensureCur();
  let b = id ? S.blocks.find(x => x.type === 'tool' && x.id === id) : null;
  if (!b) {
    const el = tmpBlock(blockEl('tool', { name }));
    S.curBody.appendChild(el);
    b = { type: 'tool', el, id, name, tmp: true };
    S.blocks.push(b);
  }
  const el = b.el;
  el.classList.remove('running', 'ok', 'error');
  el.classList.add(state);
  if (el._spin && state !== 'running') el._spin.remove();
  if (name && el._args && !el._args.textContent) el._args.textContent = '';
  if (args && el._args) el._args.textContent = (args.command || args.path || args.pattern || JSON.stringify(args)).slice(0, 100);
  if (el._stat) {
    el._stat.textContent = state === 'ok' ? (durationMs ? (durationMs / 1000).toFixed(1) + 's' : '✓')
      : state === 'error' ? '失败' : '运行中';
  }
  if (out && el._pre && !el._pre.textContent) {
    // [图片 xxKB] 这类占位符没意义，去掉
    const t = String(out).replace(/^\[图片[^\]]*\]\s*$/gm, '').trim();
    el._pre.textContent = t.length > 600 ? t.slice(0, 600) + '…' : t;
    if (!t) el._pre.style.display = 'none';
  }
  if (images && images.length) renderToolImages(el, images);
  scrollDown();
}

// ---------------------------------------------------------------- WebSocket
function connect() {
  let wsUrl;
  if (S.apiBase) {
    // APK 模式：连远程，token 走 query（WS 不能带自定义头）
    const u = new URL(S.apiBase);
    const proto = u.protocol === 'https:' ? 'wss' : 'ws';
    const tok = localStorage.getItem('pi.token') || '';
    wsUrl = `${proto}://${u.host}/ws${tok ? '?token=' + encodeURIComponent(tok) : ''}`;
  } else {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const q = S.token ? ('?token=' + encodeURIComponent(S.token)) : '';
    wsUrl = `${proto}://${location.host}/ws${q}`;
  }
  const ws = new WebSocket(wsUrl);
  S.ws = ws;

  ws.onopen = () => {
    S.retry = 0;
    setStatus('');
    ws.send(JSON.stringify({ t: 'attach', deviceId: S.device }));
    applyBusy();
  };

  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    handle(m);
  };

  ws.onclose = (e) => {
    applyBusy();
    if (e.code === 4001) {
      setStatus('⚠️ 未登录或会话已过期');
      localStorage.removeItem('pi.token');
      setTimeout(() => { if (S.apiBase) modalLogin(); else location.href = '/login'; }, 600);
      return;
    }
    const delay = Math.min(1000 * Math.pow(1.7, S.retry++), 15000);
    setStatus(`重连中… (${Math.round(delay / 1000)}s)`);
    setTimeout(connect, delay);
  };

  ws.onerror = () => {};
}

const LOCAL_CMDS = {
  '/new': () => { S.ws?.send(JSON.stringify({ t: 'new_session' })); },
  '/compact': () => { S.ws?.send(JSON.stringify({ t: 'compact' })); toast('压缩中…'); },
  '/stop': () => { S.ws?.send(JSON.stringify({ t: 'abort' })); },
  '/model': () => { S.ws?.send(JSON.stringify({ t: 'get_models' })); },
  '/status': () => { openStatus(); },
  '/help': () => {
    addMsg('sys', '可用命令：\n/new 开新会话\n/compact 压缩上下文\n/stop 中断当前任务\n/model 切换模型\n/status 会话状态\n其它 /xxx 直接发给 pi（扩展命令也能用）');
  },
  '/reload': () => { S.ws?.send(JSON.stringify({ t: 'get_messages' })); },
};

function runCommand(cmd) {
  const fn = LOCAL_CMDS[cmd.trim()];
  if (fn) fn();
  else S.ws?.send(JSON.stringify({ t: 'prompt', text: cmd }));
}

function send() {
  const text = inp.value.trim();
  const files = (S.attachments || []).map(f => ({ path: f.path }));
  if (!text && !files.length) return;

  if (text.startsWith('/') && !files.length) {
    addMsg('user', text);
    runCommand(text);
  } else {
    const payload = { t: 'prompt', text };
    if (files.length) payload.files = files;
    // 流式中发送 → 默认 steer（立即打断并注入新指令，不用等它说完）
    if (S.streaming) payload.mode = 'steer';
    S.ws?.send(JSON.stringify(payload));
    pendingEcho.push(text);

    // 本地回显：文本 + 附件名
    const shown = text + (files.length ? (text ? '\n\n' : '') + files.map(f => '📎 ' + f.path.split('/').pop()).join('\n') : '');
    addMsg('user', shown);
    S.attachments = [];
    renderAttachBar();
  }
  inp.value = '';
  autoGrow();
  scrollDown(true);
}

// 输入框上方的附件条
function renderAttachBar() {
  const bar = document.getElementById('attachBar');
  if (!bar) return;
  const list = S.attachments || [];
  bar.innerHTML = '';
  if (!list.length) { bar.className = ''; return; }
  bar.className = 'on';
  for (const f of list) {
    const chip = document.createElement('span');
    chip.className = 'attachChip';
    const icon = f.kind === 'dir' ? '📁' : '📎';
    chip.innerHTML = `<span>${icon}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px">${esc(f.name || f.path.split('/').pop())}</span>`;
    const x = document.createElement('button');
    x.textContent = '×';
    x.onclick = () => {
      S.attachments = S.attachments.filter(y => y.path !== f.path);
      renderAttachBar();
    };
    chip.appendChild(x);
    bar.appendChild(chip);
  }
}

// 会话列表渲染
/** 按修改时间分组：今天 / 昨天 / 本周 / 本月 / 更早 */
function groupLabel(ts) {
  const t = new Date(ts).getTime();
  if (!Number.isFinite(t)) return '更早';
  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const oneDay = 86400000;
  if (t >= startOfToday) return '今天';
  if (t >= startOfToday - oneDay) return '昨天';
  if (t >= startOfToday - 7 * oneDay) return '本周';
  if (t >= startOfToday - 30 * oneDay) return '本月';
  return '更早';
}

function renderSessions(sessions, currentPath) {
  S.sessions = sessions;
  S.currentPath = currentPath;
  applySessFilter();
}

/** 根据搜索词过滤并渲染 */
function applySessFilter() {
  const box = document.getElementById('sessBox');
  if (!box) return;

  const q = (S.sessQuery || '').toLowerCase();
  const all = S.sessions || [];
  const currentPath = S.currentPath;

  const list = q
    ? all.filter(s => {
        const title = (s.name || s.firstMessage || '').toLowerCase();
        return title.includes(q) || String(s.path || '').toLowerCase().includes(q);
      })
    : all;

  box.innerHTML = '';

  if (!all.length) {
    box.innerHTML = '<div class="row"><div class="grow" style="color:var(--fg3)">还没有历史对话</div></div>';
    return;
  }
  if (!list.length) {
    box.innerHTML = '<div class="row"><div class="grow" style="color:var(--fg3)">没有匹配「' + esc(q) + '」的对话</div></div>';
    return;
  }

  // 按时间分组
  const groups = new Map();
  for (const s of list) {
    const g = groupLabel(s.modified);
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(s);
  }
  // 保证分组顺序
  const ORDER = ['今天', '昨天', '本周', '本月', '更早'];

  // 折叠状态：搜索时强制展开（否则看不到结果）
  const collapsed = S.sessCollapsed || (S.sessCollapsed = new Set());

  for (const gname of ORDER) {
    const items = groups.get(gname);
    if (!items || !items.length) continue;

    const isCollapsed = !q && collapsed.has(gname);

    const gh = document.createElement('div');
    gh.className = 'sess-group' + (isCollapsed ? ' collapsed' : '');
    gh.innerHTML =
      '<span class="sg-arrow">' + (isCollapsed ? '▸' : '▾') + '</span>' +
      '<span class="sg-name">' + gname + '</span>' +
      '<span class="sg-count">' + items.length + '</span>';
    gh.onclick = () => {
      if (q) return;   // 搜索中不折叠
      if (collapsed.has(gname)) collapsed.delete(gname);
      else collapsed.add(gname);
      applySessFilter();
    };
    box.appendChild(gh);

    if (!isCollapsed) {
      for (const s of items) box.appendChild(sessionRow(s, currentPath, q));
    }
  }
}

/** 单个会话行 */
function sessionRow(s, currentPath, q) {
  const isCur = currentPath && s.path === currentPath;
  const r = document.createElement('div');
  r.className = 'row' + (isCur ? ' sel' : '');
  r.style.cssText = 'align-items:flex-start;flex-direction:column;gap:2px;position:relative;cursor:pointer';

  const title = s.name || s.firstMessage || '(空会话)';
  const titleHtml = highlight(title.slice(0, 60), q);

  r.innerHTML =
    `<div style="display:flex;width:100%;gap:8px;align-items:baseline">` +
      `<div class="grow" style="font-weight:${isCur ? 600 : 400};color:${isCur ? 'var(--acc)' : 'var(--fg)'}">${titleHtml}</div>` +
      (isCur ? '<span class="tick">当前</span>' : '<span class="chev">›</span>') +
    `</div>` +
    `<div style="display:flex;gap:8px;font-size:11px;color:var(--fg3);width:100%">` +
      `<span>${relTime(s.modified)}</span><span>${s.messageCount} 条</span>` +
      `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45%">${esc(cwdLabel(s.cwd))}</span>` +
    `</div>` +
    `<div style="display:flex;gap:6px;margin-top:6px">` +
      `<button data-a="rename" style="padding:4px 10px;border-radius:7px;background:var(--bg2);border:1px solid var(--line);font-size:12px">重命名</button>` +
      `<button data-a="del" style="padding:4px 10px;border-radius:7px;background:var(--bg2);border:1px solid #5a2a2a;color:#ffb3ad;font-size:12px">删除</button>` +
    `</div>`;

  r.onclick = (e) => {
    if (e.target.closest('button')) return;
    S.ws?.send(JSON.stringify({ t: 'open_session', path: s.path }));
    closeSheet();
    toast('加载中…');
  };
  r.querySelector('[data-a="rename"]').onclick = (e) => {
    e.stopPropagation();
    const name = prompt('会话名称', s.name || '');
    if (name === null) return;
    S.ws?.send(JSON.stringify({ t: 'rename_session', path: s.path, name }));
  };
  r.querySelector('[data-a="del"]').onclick = (e) => {
    e.stopPropagation();
    if (!confirm('删除这个会话？不可恢复。')) return;
    S.ws?.send(JSON.stringify({ t: 'delete_session', path: s.path }));
  };
  return r;
}

/** 把匹配的片段包成 <mark> */
function highlight(text, q) {
  const safe = esc(text);
  if (!q) return safe;
  const idx = text.toLowerCase().indexOf(q);
  if (idx < 0) return safe;
  const before = esc(text.slice(0, idx));
  const hit = esc(text.slice(idx, idx + q.length));
  const after = esc(text.slice(idx + q.length));
  return before + '<mark>' + hit + '</mark>' + after;
}

      if (res.ok && d.ok) {
        showMsg('ok', '✅ 密码已修改，其它设备已退出登录');
        oldEl.value = newEl.value = repEl.value = '';
        setTimeout(() => { closeSheet(); openSettings(); }, 1400);
      } else {
        showMsg('err', d.error || '修改失败');
      }
    } catch {
      showMsg('err', '网络错误，请重试');
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = '确认修改';
    }
  };

  sheetIn.appendChild(form);
  sheet.classList.add('open');
  setTimeout(() => oldEl.focus(), 120);
}

async function loadAudit() {
  const box = document.getElementById('auditBox');
  if (!box) return;
  try {
    const r = await apiFetch('/api/audit?limit=120');
    if (handle401(r)) return;
    const d = await r.json();
    const list = d.entries || [];
    box.innerHTML = '';
    if (!list.length) {
      box.innerHTML = '<div class="row"><div class="grow" style="color:var(--fg3)">还没有记录</div></div>';
      return;
    }
    let lastDay = '';
    for (const e of list) {
      const dt = new Date(e.ts);
      const day = `${dt.getMonth() + 1}/${dt.getDate()}`;
      if (day !== lastDay) {
        lastDay = day;
        const dh = document.createElement('div');
        dh.style.cssText = 'font-size:11px;color:var(--fg3);padding:10px 4px 4px;font-weight:600';
        dh.textContent = day;

      const extra = e.event === 'login_failed' && e.attempt > 1 ? `（第 ${e.attempt} 次）` : '';
      row.innerHTML =
        `<div style="flex:0 0 auto;font-size:11.5px;color:var(--fg3);font-variant-numeric:tabular-nums;padding-top:2px">${time}</div>` +
        `<div style="flex:1;min-width:0">` +
          `<div style="font-size:13.5px;color:${color};font-weight:500">${esc(label)}${esc(extra)}</div>` +
          `<div style="font-size:11.5px;color:var(--fg3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">` +
            `${esc(e.ip || '?')}${e.ua ? ' · ' + esc(e.ua) : ''}</div>` +

  } catch {

const FB = { path: null, device: null, loading: false, selected: [] };

function fmtSize(n) {
  if (!n) return '';
  const u = ['B', 'KB', 'MB', 'GB'];
  let i = 0, v = n;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(v < 10 ? 1 : 0)) + u[i];
}

function fileIcon(e) {
  if (e.type === 'dir') return '📁';
  if (e.type === 'link') return '🔗';
  const n = e.name.toLowerCase();
  if (/\.(png|jpg|jpeg|gif|webp|bmp|svg|ico|avif)$/.test(n)) return '🖼';
  if (/\.(md|markdown)$/.test(n)) return '📝';
  if (/\.(js|cjs|mjs|ts|tsx|jsx|py|go|rs|java|c|h|cpp|sh|rb|php|lua)$/.test(n)) return '📜';
  if (/\.(json|yaml|yml|toml|ini|conf|env)$/.test(n)) return '⚙️';
  if (/\.(zip|tar|gz|tgz|7z|rar)$/.test(n)) return '📦';
  if (/\.(mp4|mov|mkv|avi|webm)$/.test(n)) return '🎬';
  if (/\.(mp3|wav|flac|m4a|ogg)$/.test(n)) return '🎵';
  if (/\.(pdf)$/.test(n)) return '📕';
  if (/\.(lock)$/.test(n)) return '🔒';
  return '📄';
}

async function loadFileDir(path) {
  const box = document.getElementById('fbBox');
  const crumbs = document.getElementById('fbCrumbs');
  if (!box) return;
  FB.loading = true;
  box.innerHTML = '<div class="row"><div class="grow" style="color:var(--fg3)">加载中…</div></div>';

  try {
    const q = new URLSearchParams({ device: FB.device || 'local' });
    if (path) q.set('path', path);
    const r = await apiFetch('/api/files?' + q);
    if (handle401(r)) return;
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || '加载失败');

    FB.path = d.path;
    renderCrumbs(crumbs, d.path);
    box.innerHTML = '';

    const list = d.entries || [];
    if (!list.length) {
      box.innerHTML = '<div class="row"><div class="grow" style="color:var(--fg3)">空目录</div></div>';
      return;
    }
    for (const e of list) {
      const row = document.createElement('div');
      row.className = 'row';
      row.style.cssText = 'gap:9px;padding:10px 12px;margin-bottom:5px';
      const isDir = e.type !== 'file';
      const full = joinPath(FB.path, e.name);
      const picked = FB.selected.some(x => x.path === full);
      if (picked) row.style.borderColor = 'var(--acc)';
      row.innerHTML =
        `<span style="flex:0 0 auto;font-size:16px;line-height:1">${fileIcon(e)}</span>` +
        `<div class="grow" style="font-family:ui-monospace,Menlo,monospace;font-size:13px;color:${isDir ? 'var(--acc)' : 'var(--fg)'}">${esc(e.name)}</div>` +
        (isDir ? '' : `<span style="flex:0 0 auto;font-size:11px;color:var(--fg3)">${fmtSize(e.size)}</span>`);
      // 复制路径
      const copyBtn = document.createElement('button');
      copyBtn.textContent = '⧉';
      copyBtn.title = '复制路径';
      copyBtn.style.cssText = 'flex:0 0 auto;width:26px;height:26px;border-radius:8px;font-size:13px;line-height:1;background:transparent;border:0;color:var(--fg3)';
      copyBtn.onclick = async (ev) => {
        ev.stopPropagation();
        const ok = await copyText(full);
        toast(ok ? '已复制：' + full : '复制失败');
      };
      row.appendChild(copyBtn);

      // 勾选按钮（文件和目录都可加入对话）
      const chk = document.createElement('button');
      chk.textContent = picked ? '✓' : '＋';
      chk.style.cssText = 'flex:0 0 auto;width:26px;height:26px;border-radius:8px;font-size:13px;' +
        (picked ? 'background:var(--acc);color:#fff;border:0' : 'background:var(--bg2);border:1px solid var(--line);color:var(--fg2)');
      chk.onclick = (ev) => {
        ev.stopPropagation();
        togglePick(full, e.name, e.size, isDir ? 'dir' : 'file');
        loadFileDir(FB.path);
      };
      row.appendChild(chk);

      row.onclick = () => {
        if (isDir) loadFileDir(full);
        else openFilePreview(full, e.name);
      };
      row.oncontextmenu = async (ev) => {
        ev.preventDefault();
        const ok = await copyText(full);
        toast(ok ? '已复制：' + full : '复制失败');
      };
      box.appendChild(row);
    }
  } catch (err) {
    box.innerHTML = `<div class="row"><div class="grow" style="color:#ffb3ad">${esc(err.message)}</div></div>`;
  } finally {
    FB.loading = false;
  }
}

// 剪贴板：优先 navigator.clipboard，失败降级 execCommand
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch {}
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch { return false; }
}

function joinPath(dir, name) {
  if (!dir) return '/' + name;
  return dir.replace(/\/+$/, '') + '/' + name;
}

function renderCrumbs(el, fullPath) {
  el.innerHTML = '';
  const parts = String(fullPath || '/').split('/').filter(Boolean);
  const mk = (label, target) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.style.cssText = 'background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:11.5px;font-family:inherit;color:var(--fg2);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
    b.onclick = () => loadFileDir(target);
    return b;
  };
  el.appendChild(mk('/', '/'));
  let acc = '';
  for (const p of parts) {
    acc += '/' + p;
    const sep = document.createElement('span');
    sep.textContent = '/';
    sep.style.cssText = 'color:var(--fg3);font-size:11px';
    el.appendChild(sep);
    el.appendChild(mk(p, acc));
  }
}

/**
 * 图片加载失败诊断：区分是网络/认证/服务端/解码问题。
 * 返回多行文本，直接显示在界面上，同时打到 console。
 */
async function diagnoseImageFail(url, fullPath) {
  const lines = [];
  const hideTok = (u) => String(u).replace(/token=([^&]{6})[^&]*/, 'token=$1…');
  lines.push('URL: ' + hideTok(url));
  lines.push('环境: ' + (S.apiBase ? 'APK 远程模式' : '浏览器同源模式'));
  lines.push('apiBase: ' + (S.apiBase || '(空)'));
  lines.push('有 token: ' + (localStorage.getItem('pi.token') ? '是' : '否'));

  // 用 fetch 复现一次，拿到真实状态码
  try {
    const r = await fetch(url, { credentials: S.apiBase ? 'omit' : 'same-origin' });
    lines.push('HTTP 状态: ' + r.status + ' ' + (r.statusText || ''));
    lines.push('Content-Type: ' + (r.headers.get('content-type') || '(无)'));
    lines.push('Content-Length: ' + (r.headers.get('content-length') || '(无)'));
    if (!r.ok) {
      let body = '';
      try { body = (await r.text()).slice(0, 200); } catch {}
      lines.push('响应体: ' + (body || '(空)'));
      if (r.status === 401) lines.push('\n→ 认证失败：token 可能过期，请重新登录');
      if (r.status === 404) lines.push('\n→ 服务器找不到文件：路径可能不对');
    } else {
      // 200 但仍 onerror → 多半是解码失败
      const blob = await r.blob();
      lines.push('实际大小: ' + blob.size + ' 字节');
      lines.push('判定: 服务器返回正常，但 <img> 解码失败');
      lines.push('可能原因: 图片损坏 / 体积过大（WebView 内存不足）/ 格式不支持');
      // 试着 createImageBitmap 定位
      try {
        const bmp = await createImageBitmap(blob);
        lines.push('createImageBitmap 成功: ' + bmp.width + 'x' + bmp.height);
      } catch (e) {
        lines.push('createImageBitmap 失败: ' + e.message);
      }
    }
  } catch (e) {
    lines.push('fetch 异常: ' + e.name + ' ' + e.message);
    lines.push('\n→ 网络层失败：连不上服务器 / CORS 被拦 / 混合内容被阻止');
    lines.push('页面协议: ' + location.protocol);
  }

  lines.push('文件: ' + fullPath);
  return lines.join('\n');
}

async function openFilePreview(fullPath, name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  const isImg = /^(png|jpg|jpeg|gif|webp|bmp|svg|ico|avif)$/.test(ext);
  const q = new URLSearchParams({ device: FB.device || 'local', path: fullPath });

  if (isImg) {
    // 直接当图片显示
    // 先加载缩略图（大图原图会让 WebView 解码失败）
    const thumbQ = new URLSearchParams(q);
    thumbQ.set('thumb', '1');
    const url = imgUrl('/api/file?' + thumbQ);
    // 全屏用 1600px JPEG（约 300KB），比原图 4.5MB PNG 快得多
    const viewQ = new URLSearchParams(q);
    viewQ.set('view', '1');
    const origUrl = imgUrl('/api/file?' + viewQ);
    sheetIn.innerHTML = '';
    const h = document.createElement('h3');
    h.textContent = name;
    h.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:10px;text-transform:none;color:var(--fg);font-family:ui-monospace,Menlo,monospace';
    const back = document.createElement('button');
    back.textContent = '←';
    back.style.cssText = 'background:var(--bg3);border:1px solid var(--line);border-radius:8px;width:30px;height:30px;font-size:15px;color:var(--fg)';
    back.onclick = () => openFileBrowser();
    h.prepend(back);
    sheetIn.appendChild(h);
    const img = document.createElement('img');
    img.src = url;
    img.style.cssText = 'width:100%;border-radius:11px;background:#0e1014;display:block';
    img.dataset.orig = origUrl;
    img.onclick = () => openLightbox(origUrl);
    img.style.cursor = 'zoom-in';
    img.onerror = async () => {
      // 诊断：把失败原因摊开，别只说"加载失败"
      const info = await diagnoseImageFail(url, fullPath);
      const box = document.createElement('div');
      box.style.cssText = 'color:#ffb3ad;font-size:12.5px;line-height:1.7;background:#2a1a1a;border:1px solid #4a2626;border-radius:10px;padding:12px;white-space:pre-wrap;word-break:break-all';
      box.textContent = '图片加载失败\n\n' + info;
      const retry = document.createElement('button');
      retry.textContent = '重试';
      retry.style.cssText = 'margin-top:10px;padding:7px 16px;border-radius:8px;background:#3a2020;border:1px solid #6a3636;color:#ffb3ad;font-size:12.5px';
      retry.onclick = () => openFilePreview(fullPath, name);
      box.appendChild(retry);
      img.replaceWith(box);

  try {

    const ct = r.headers.get('content-type') || '';

/** 版本展示：优先 versionName（0.4），没有则用 v0.<code> */
function versionLabel(code, name) {

  const n = Number(code || 0);

}

// ---------------------------------------------------------------- 更新检查
/** 比对版本，返回是否有新版 */
async function checkUpdate(manual) {
  const cur = Number(S.appVersion || 0);
  let info;
  try {
    const r = await apiFetch('/api/version');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    info = await r.json();
  } catch (e) {
    if (manual) toast('检查失败：' + e.message);
    return null;
  }
  S.remoteVersion = info;

  // 非 APK 环境或版本未知：只提示
  if (!cur) {
    if (manual) {
      showUpdateDialog(info, '当前是浏览器环境，无法自动更新。APK 最新版本 ' + (info.versionName || '?'));
    }
    return info;
  }
  const remote = Number(info.versionCode || 0);
  if (remote <= cur) {
    if (manual) toast('已是最新版本 ' + (info.versionName || versionLabel(cur, S.appVersionName)));
    return info;
  }

  // 落后版本数：按 versionCode 差值判断
  const behind = remote - cur;
  // 落后 >= 2 个版本 → 强制更新（不能用「稍后」跳过）
  const force = behind >= FORCE_UPDATE_GAP;
  showUpdateDialog(info, null, force);
  return info;
}

/**
 * 更新弹窗
 * @param {object} info  /api/version 响应
 * @param {string} customMsg  自定义说明（如浏览器环境）

  const meta = document.createElement('div');
  meta.style.cssText = 'font-size:11.5px;color:var(--fg3);margin-bottom:10px;line-height:1.65';

  if (info.publishedAt) parts.push(new Date(info.publishedAt).toLocaleDateString('zh-CN'));

    box.appendChild(why);
  }

  if (info.notes) {
    const notes = document.createElement('div');
    notes.style.cssText = 'font-size:12.5px;color:var(--fg2);background:var(--bg3);border-radius:9px;padding:10px 12px;margin-bottom:10px;white-space:pre-wrap;line-height:1.65;max-height:160px;overflow:auto';
    notes.textContent = info.notes;
    box.appendChild(notes);
  }

  if (info.url) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;gap:6px';

    const go = document.createElement('button');
    go.className = 'opt';
    go.style.cssText = 'background:linear-gradient(135deg,var(--acc),#4171d6);color:#fff;font-weight:600;border:0;text-align:center';
    go.textContent = force ? '立即更新' : '下载更新';

    const barWrap = document.createElement('div');
    barWrap.style.cssText = 'display:none;height:5px;background:var(--bg3);border-radius:99px;overflow:hidden;margin-top:2px';
    const bar = document.createElement('div');
    bar.style.cssText = 'height:100%;width:0%;background:var(--acc);transition:width .25s';
    barWrap.appendChild(bar);
    const hint = document.createElement('div');
    hint.style.cssText = 'display:none;font-size:11.5px;color:var(--fg3);text-align:center';

    go.onclick = () => startUpdateDownload(info, go, barWrap, bar, hint);
    wrap.append(go, barWrap, hint);
    box.appendChild(wrap);
  }

  // 强制更新不提供跳过
  if (!force) {
    const later = document.createElement('button');
    later.className = 'opt';
    later.textContent = customMsg ? '知道了' : '稍后再说';

    tip.textContent = '更新后会自动保留登录状态';

/** 开始下载 APK：原生模块优先，其次退回浏览器 */
function startUpdateDownload(info, btn, barWrap, bar, hint) {
  const url = apiUrl(info.url);

  // 非 APK 环境（浏览器）：直接打开
  if (!window.PiApk) {
    window.open(url, '_blank');
    return;
  }

  btn.disabled = true;
  btn.style.opacity = '.6';
  btn.textContent = '下载中…';
  barWrap.style.display = 'block';
  hint.style.display = 'block';
  hint.textContent = '准备中…';

  let ok = false;
  try { ok = window.PiApk.download(url); } catch (e) { ok = false; }
  if (!ok) {
    btn.disabled = false; btn.style.opacity = '1'; btn.textContent = '下载更新';
    hint.textContent = '已有下载在进行';
    return;
  }

  const timer = setInterval(() => {
    let st;
    try { st = JSON.parse(window.PiApk.getState()); } catch { return; }
    const mb = (n) => (n / 1048576).toFixed(1);

    if (st.state === 'downloading') {
      if (st.percent >= 0) {
        bar.style.width = st.percent + '%';
        hint.textContent = mb(st.got) + ' / ' + mb(st.total) + ' MB  (' + st.percent + '%)';
      } else {
        bar.style.width = '30%';
        // 显示当前阶段，便于定位卡在哪一步
        hint.textContent = '已下载 ' + mb(st.got) + ' MB' + (st.step ? '  [' + st.step + ']' : '');
      }
    } else if (st.state === 'done') {
      clearInterval(timer);
      bar.style.width = '100%';
      // 下载完成 → 自动安装，不需要用户再点
      hint.textContent = '下载完成（' + mb(st.got) + ' MB），正在安装…';
      btn.textContent = '安装中…';
      setTimeout(() => startInstall(btn, hint), 200);
    } else if (st.state === 'installing') {
      clearInterval(timer);
      hint.textContent = st.error || '请在弹出的界面完成安装';
    } else if (st.state === 'error') {
      clearInterval(timer);
      barWrap.style.display = 'none';
      hint.textContent = '下载失败：' + st.error;
      btn.disabled = false; btn.style.opacity = '1'; btn.textContent = '重试';
      sendClientLog('download_error', st.error, { step: st.step, got: st.got, total: st.total });
    }
  }, 400);

  // 兜底：5 分钟没结束就停止轮询
  setTimeout(() => clearInterval(timer), 300000);
}

/** 触发安装并持续观察状态（安装器可能弹不及时，或抛错） */
function startInstall(btn, hint) {
  clPush('INFO', 'install clicked');
  btn.disabled = true;
  btn.style.opacity = '.6';

  // 先确认「安装未知应用」权限，没有就带用户去开
  let can = true;
  try { if (window.PiApk.canInstall) can = window.PiApk.canInstall(); } catch {}
  if (!can) {
    hint.textContent = '请打开「允许安装未知应用」开关，返回后会自动继续';
    sendClientLog('install_need_permission', 'REQUEST_INSTALL_PACKAGES not granted', {});
    try { window.PiApk.openInstallPermission(); } catch (e) {
      hint.textContent = '无法打开权限设置：' + e.message;
    }
    // 回来后自动再试
    const onVis = () => {
      if (document.visibilityState !== 'visible') return;
      document.removeEventListener('visibilitychange', onVis);
      setTimeout(() => {
        let ok2 = false;
        try { ok2 = window.PiApk.canInstall(); } catch {}
        if (ok2) {
          hint.textContent = '权限已开启，正在安装…';
          startInstall(btn, hint);
        } else {
          hint.textContent = '仍未获得权限，请在系统设置里允许后点「重试」';
          btn.disabled = false; btn.style.opacity = '1'; btn.textContent = '重试安装';
          btn.onclick = () => startInstall(btn, hint);
        }
      }, 800);
    };
    document.addEventListener('visibilitychange', onVis);
    return;
  }

  btn.disabled = true;
  btn.style.opacity = '.6';
  hint.textContent = '正在打开安装器…';

  let called = false;
  try {
    window.PiApk.install();
    called = true;
  } catch (e) {
    hint.textContent = '安装异常：' + e.message;
    btn.disabled = false; btn.style.opacity = '1';
    sendClientLog('install_js_error', e.message, { stack: (e.stack || '').slice(0, 800) });
    return;
  }
  if (!called) return;

  // 持续观察 20 秒，把 Java 侧的真实进展显示出来
  let ticks = 0;
  const timer = setInterval(() => {
    ticks++;
    let st;
    try { st = JSON.parse(window.PiApk.getState()); } catch { return; }

    if (st.state === 'error') {
      clearInterval(timer);
      hint.textContent = '安装失败 [' + (st.step || '?') + ']：' + st.error;
      btn.disabled = false; btn.style.opacity = '1'; btn.textContent = '重试安装';
      sendClientLog('install_error', st.error, { step: st.step });
      return;
    }
    if (st.error) {
      // 例如缺权限
      hint.textContent = st.error;
      btn.disabled = false; btn.style.opacity = '1'; btn.textContent = '再试一次';
      clearInterval(timer);
      sendClientLog('install_notice', st.error, { step: st.step });
      return;
    }
    if (st.state === 'installing' && st.step === 'install') {
      hint.textContent = '安装器已打开，请在系统界面确认';
    } else {
      hint.textContent = '正在打开安装器… [' + (st.step || 'starting') + ']';
    }

    if (ticks > 50) {   // 20 秒
      clearInterval(timer);
      hint.textContent = '安装器似乎没弹出，请检查系统是否拦截了安装';
      btn.disabled = false; btn.style.opacity = '1'; btn.textContent = '再试一次';
      sendClientLog('install_timeout', 'installer did not appear in 20s', st);
    }
  }, 400);
}

function relTime(ts) {
  const t = new Date(ts).getTime();
  if (!Number.isFinite(t)) return '';
  const d = Date.now() - t;
  if (d < 60e3) return '刚刚';
  if (d < 3600e3) return Math.floor(d / 60e3) + ' 分钟前';
  if (d < 86400e3) return Math.floor(d / 3600e3) + ' 小时前';
  if (d < 7 * 86400e3) return Math.floor(d / 86400e3) + ' 天前';
  const dt = new Date(t);
  return `${dt.getMonth() + 1}/${dt.getDate()}`;
}

function shortCwd(c) {
  if (!c) return '';
  return c.replace(/^\/root$/, '~').replace(/^\/home\/[^/]+$/, '~').replace(/^\/root/, '~').replace(/^\/home\/[^/]+/, '~');
}

// 会话标签：优先显示项目目录名，根目录则不显示
function cwdLabel(c) {
  if (!c) return '';
  const home = c.replace(/^\/root$/, '').replace(/^\/home\/[^/]+$/, '');
  if (home === '') return '';
  const parts = c.split('/').filter(Boolean);
  return parts[parts.length - 1] || c;
}

// ---------------------------------------------------------------- 扩展 UI 对话框
const dlg = $('#dialog'), dlgIn = $('#dialogIn');

function showUiRequest(rec) {
  // rec: { id, method, title, message, options?, placeholder? ... }
  const id = rec.id;
  const method = rec.method || rec.type;
  dlgIn.innerHTML = '';
  const q = document.createElement('div');
  q.className = 'q';
  q.textContent = rec.message || rec.title || '需要你确认';
  dlgIn.appendChild(q);

  const resp = (payload) => {
    S.ws?.send(JSON.stringify({ t: 'ui_response', payload: { id, ...payload } }));
    dlg.classList.remove('open');
  };

  if (method === 'confirm') {
    const yes = document.createElement('button'); yes.className = 'opt'; yes.textContent = '确定';
    yes.onclick = () => resp({ confirmed: true });
    const no = document.createElement('button'); no.className = 'opt'; no.textContent = '取消';
    no.onclick = () => resp({ confirmed: false });
    dlgIn.append(yes, no);
  } else if (method === 'select' && Array.isArray(rec.options)) {
    rec.options.forEach((o, i) => {
      const b = document.createElement('button');
      b.className = 'opt';
      b.innerHTML = `<span class="num">${i + 1}</span>${esc(typeof o === 'string' ? o : (o.label || o.value))}`;
      b.onclick = () => resp({ value: typeof o === 'string' ? o : (o.value ?? o.label) });
      dlgIn.appendChild(b);
    });
    const c = document.createElement('button'); c.className = 'opt'; c.textContent = '取消';
    c.onclick = () => resp({ cancelled: true });
    dlgIn.appendChild(c);
  } else if (method === 'input' || method === 'editor') {
    const ta = document.createElement('textarea');
    ta.style.cssText = 'width:100%;min-height:90px;background:var(--bg3);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;resize:vertical';
    ta.placeholder = rec.placeholder || '';
    ta.value = rec.prefill || rec.value || '';
    dlgIn.appendChild(ta);
    const ok = document.createElement('button'); ok.className = 'opt'; ok.style.marginTop = '10px'; ok.textContent = '提交';
    ok.onclick = () => resp({ value: ta.value });
    const c = document.createElement('button'); c.className = 'opt'; c.textContent = '取消';
    c.onclick = () => resp({ cancelled: true });
    dlgIn.append(ok, c);
    setTimeout(() => ta.focus(), 50);
  } else {
    const ok = document.createElement('button'); ok.className = 'opt'; ok.textContent = '知道了';
    ok.onclick = () => dlg.classList.remove('open');
    dlgIn.appendChild(ok);
  }
  dlg.classList.add('open');
}
