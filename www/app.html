// 若被 APK 打开（?server=... 或 localStorage 有配置），改为远程模式。
(function initAppMode() {
  const params = new URLSearchParams(location.search);
  const fromQuery = params.get('server');
  const saved = localStorage.getItem('pi.server');
  const base = fromQuery || saved;
  if (!base) return;      // 浏览器模式，同源

  S.apiBase = String(base).replace(/\/+$/, '');
  // APK 版本号：从 query 或 window 全局取
  S.appVersion = Number(params.get('v') || (typeof window.__APP_VERSION__ === 'number' ? window.__APP_VERSION__ : 0)) || 0;
  // 展示用版本名（0.4），与用于比较的 versionCode（39）分开
  S.appVersionName = params.get('vn') ||
    (typeof window.__APP_VERSION_NAME__ === 'string' ? window.__APP_VERSION_NAME__ : '');
  localStorage.setItem('pi.server', S.apiBase);
  const tok = params.get('token');
  if (tok) {
    localStorage.setItem('pi.token', tok);
    // 清掉 URL 里的 token，避免留在历史记录
    try {
      const u = new URL(location.href);
      u.searchParams.delete('token');
      u.searchParams.delete('server');
      history.replaceState(null, '', u.pathname + (u.search || ''));
    } catch {}
  }
})();

// APK 模式的登录弹窗
function modalLogin(prefillErr) {
  const dlg = document.getElementById('dialog');
  const box = document.getElementById('dialogIn');
  if (!dlg || !box) { location.reload(); return; }
  box.innerHTML = '';
  const q = document.createElement('div');
  q.className = 'q';
  q.textContent = '登录 ' + (S.apiBase || '');
  const pw = document.createElement('input');
  pw.type = 'password';
  pw.placeholder = '访问密码';
  pw.autocapitalize = 'off';
  pw.spellcheck = false;
  pw.style.cssText = 'width:100%;padding:12px;background:var(--bg3);color:var(--fg);border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;outline:none;margin-bottom:10px';
  const err = document.createElement('div');
  err.style.cssText = 'font-size:12px;color:#ffb3ad;margin-bottom:8px;display:none';
  if (prefillErr) { err.textContent = prefillErr; err.style.display = 'block'; }
  const ok = document.createElement('button');
  ok.className = 'opt';
  ok.style.cssText = 'background:linear-gradient(135deg,var(--acc),#4171d6);color:#fff;font-weight:600;border:0;text-align:center';
  ok.textContent = '登录';
  box.append(q, pw, err, ok);
  dlg.classList.add('open');
  setTimeout(() => pw.focus(), 100);

  let sending = false;
  const submit = async () => {
    if (sending) return;
    const v = pw.value.trim();
    if (!v) { err.textContent = '请输入密码'; err.style.display = 'block'; return; }
    sending = true;
    ok.textContent = '验证中…';
    try {
      const r = await fetch(apiUrl('/api/login'), {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ password: v }),
      });
      const d = await r.json().catch(() => ({}));
      if (r.ok && d.ok && d.token) {
        localStorage.setItem('pi.token', d.token);
        dlg.classList.remove('open');
        if (S.ws) { try { S.ws.close(); } catch {} }
        connect();
      } else {
        err.textContent = d.error || '登录失败';
        err.style.display = 'block';
        ok.textContent = '登录';
        sending = false;
      }
    } catch (e) {
      err.textContent = '网络错误：' + e.message;
      err.style.display = 'block';
      ok.textContent = '登录';
      sending = false;
    }
  };
  ok.onclick = submit;
  pw.onkeydown = (e) => { if (e.key === 'Enter') submit(); };
}

// ---------------------------------------------------------------- 客户端日志上报
// 目的：出问题时自动把现场送到服务器，不用手动复制粘贴。
// 采集：console.error/warn、未捕获异常、未处理的 Promise 拒绝、手动 logEvent()

const CL = {
  buf: [],          // 环形缓冲
  max: 200,
  sent: new Set(),  // 已上报的指纹，防重复
  seq: 0,
};

function clPush(level, text) {
  const line = `[${new Date().toISOString().slice(11, 23)}] ${level} ${text}`;
  CL.buf.push(line);
  if (CL.buf.length > CL.max) CL.buf.shift();
}

/** 手动记录一条事件（会立即上报） */
function logEvent(kind, message, context) {
  clPush('EVENT', kind + ' ' + message);
  sendClientLog(kind, message, context);
}

function sendClientLog(kind, message, context) {
  const fp = kind + '|' + String(message).slice(0, 120);
  if (CL.sent.has(fp)) return;
  CL.sent.add(fp);
  if (CL.sent.size > 50) CL.sent.clear();

  const body = {
    kind,
    message: String(message).slice(0, 2000),
    context: context || {},
    appVersion: S.appVersion || 0,
    platform: (window.Capacitor && Capacitor.getPlatform && Capacitor.getPlatform()) || 'web',
    logs: CL.buf.slice(-80),
  };

  // 用 fetch 直发，不依赖 apiFetch（避免鉴权失败时丢日志）
  try {
    const url = (S.apiBase || '') + '/api/clientlog';
    fetch(url, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
      credentials: S.apiBase ? 'omit' : 'same-origin',
      keepalive: true,
    }).catch(() => {});
  } catch {}
}

// 接管 console.error / console.warn
(function hookConsole() {
  const origError = console.error.bind(console);
  const origWarn = console.warn.bind(console);
  console.error = function (...args) {
    const t = args.map(a => {
      try { return typeof a === 'string' ? a : (a && a.message) || JSON.stringify(a); }
      catch { return String(a); }
    }).join(' ');
    clPush('ERROR', t);
    origError(...args);
    // 只上报明显是我们自己的错误，避免噪音
    if (/img-fail|upload|download|install|ws|api|token/i.test(t)) {
      sendClientLog('console.error', t, { url: location.href });
    }
  };
  console.warn = function (...args) {
    const t = args.map(a => {
      try { return typeof a === 'string' ? a : (a && a.message) || JSON.stringify(a); }
      catch { return String(a); }
    }).join(' ');
    clPush('WARN', t);
    origWarn(...args);
  };
})();

// 全局异常
window.addEventListener('error', (e) => {
  if (e.target && e.target.tagName === 'IMG') {
    // 图片加载失败单独处理
    const t = 'IMG load failed: ' + (e.target.currentSrc || e.target.src || '').slice(0, 200);
    clPush('ERROR', t);
    sendClientLog('image_error', t, {
      src: (e.target.currentSrc || e.target.src || '').slice(0, 300),
      apiBase: S.apiBase,
      hasToken: !!localStorage.getItem('pi.token'),
      pageProto: location.protocol,
    });
    return;
  }
  const msg = (e.message || 'unknown') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0);
  clPush('ERROR', 'uncaught: ' + msg);
  sendClientLog('js_error', msg, { stack: (e.error && e.error.stack || '').slice(0, 1500) });
}, true);

// 未处理的 Promise 拒绝
window.addEventListener('unhandledrejection', (e) => {
  const r = e.reason;
  const msg = (r && (r.message || r.toString())) || 'unknown rejection';
  clPush('ERROR', 'unhandledrejection: ' + msg);
  sendClientLog('promise_error', msg, { stack: (r && r.stack || '').slice(0, 1500) });
});

// 启动时上报一次「会话开始」，带上环境信息
function reportSessionStart() {
  sendClientLog('session_start', 'app started', {
    apiBase: S.apiBase || '(empty)',
    appVersion: S.appVersion,
    pageProto: location.protocol,
    host: location.host,
    ua: navigator.userAgent.slice(0, 200),
    hasToken: !!localStorage.getItem('pi.token'),
    server: localStorage.getItem('pi.server') || '',
  });
}

// ---------------------------------------------------------------- Android 返回键
// MainActivity.onBackPressed 会调用它；返回 'handled' 表示已处理，否则退出
window.__onAndroidBack = function () {
  // 0) 全屏页面（设置）→ 关掉
  if (S.pageOpen) { closePage(); return 'handled'; }

  // 1) 对话框打开 → 关掉（强制更新时不允许关）
  const dlg = document.getElementById('dialog');
  if (dlg && dlg.classList.contains('open')) {
    if (S.forceUpdate) {
      toast('请先更新到最新版本');
      return 'handled';
    }
    dlg.classList.remove('open');
    return 'handled';
  }

  // 2) 抽屉打开 → 关掉（或从子面板返回上级）
  const sheet = document.getElementById('sheet');
  if (sheet && sheet.classList.contains('open')) {
    const h = sheet.querySelector('#sheetIn h3');
    const title = h ? h.textContent : '';
    // 文件预览 / 设备表单 / 改密码 / 日志 → 回上一级
    if (document.getElementById('fbBox') && title === '文件' && document.getElementById('fbCrumbs')) {
      const crumbs = [...document.querySelectorAll('#fbCrumbs button')];
      if (crumbs.length > 1) {
        // 回上级目录
        crumbs[crumbs.length - 2].click();
        return 'handled';
      }
    }
    if (title.startsWith('添加 SSH') || title.startsWith('编辑设备')) { openSheet('devices'); return 'handled'; }
    if (title === '修改登录密码' || title === '登录日志') {
      closeSheet(); setTimeout(openSettings, 200); return 'handled';
    }
    sheet.classList.remove('open');
    return 'handled';
  }

  // 3) 有附件 → 先清附件
  if (S.attachments && S.attachments.length) {
    S.attachments = [];
    renderAttachBar();
    toast('已清空附件');
    return 'handled';
  }

  // 4) 流式中 → 中断
  if (S.streaming) {
    S.ws?.send(JSON.stringify({ t: 'abort' }));
    toast('已中断');
    return 'handled';
  }

  // 5) 引导页（没有 apiBase）→ 允许退出
  return 'exit';
};

// 启动：APK 模式下先确认认证状态
(async () => {
  // 无论是否登录，先报一次环境（含未登录/连不上服务器的场景）
  setTimeout(reportSessionStart, 800);
  try { if (window.PiApk && window.PiApk.setServer) window.PiApk.setServer(S.apiBase || ''); } catch {}

  if (S.apiBase) {
    try {
      const r = await apiFetch('/api/me');
      const d = await r.json().catch(() => ({}));
      if (d.authEnabled && !d.authed) { modalLogin(); return; }
    } catch (e) {
      setStatus('⚠️ 无法连接 ' + S.apiBase);
      return;
    }
  }
  connect();
})();

// 页面重新可见时刷新历史（手机后台恢复）
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (!S.ws || S.ws.readyState > 1) connect();
    else S.ws.send(JSON.stringify({ t: 'ping' }));
  }
});
</script>
